<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="%GAME_BG%" />
    <title>%GAME_TITLE%</title>
    <!-- PORTAL_SDK -->
    <style>
      /* Shown before any script runs, so the first paint is never a white page. */
      html, body { background: %GAME_BG%; }
      /* Debug box (?debug, web builds only): the GO button sits bottom right, under the box on a
         narrow phone. Taps go through the box to the game; it only shows numbers here. */
      body > div[style*="9998"] { pointer-events: none; opacity: 0.85; font-size: 10px !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-spinner"></div>
    <div id="boot-error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
